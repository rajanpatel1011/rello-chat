# H2 In-Memory Database Configuration for local development
spring.datasource.url=jdbc:h2:mem:localdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver

# JPA/Hibernate properties
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Local schema generation is enabled for development
spring.jpa.hibernate.ddl-auto=create

# Disable Flyway for local profile because H2 is used for local schema initialization
spring.flyway.enabled=false

#tomcat server port
server.port=8082

# SSL/TLS Configuration (HTTPS)
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=springboot123
server.ssl.key-alias=springboot
server.ssl.enabled=true

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=RelloChat
