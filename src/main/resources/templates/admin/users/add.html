<!DOCTYPE html>
<html xmlns:xmls="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <title>Rello Chat - Add User</title>
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="icon" href="/rello.png">
</head>
<body>
    <div id="username-page">
        <div class="username-page-container glass-panel">
            <h1 class="title">Add New User</h1>
            <form th:action="@{/admin/users/add}" th:object="${user}" method="post">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" th:field="*{username}" placeholder="Enter username" autocomplete="off" class="form-control" required />
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}" placeholder="Enter password" class="form-control" required />
                </div>
                <div class="form-group">
                    <label for="roles">Roles (comma separated)</label>
                    <input type="text" id="roles" name="roles" placeholder="e.g. USER,ADMIN" value="USER" class="form-control" required />
                </div>
                <div class="form-group" style="margin-top: 20px;">
                    <button type="submit" class="primary">Save User</button>
                </div>
                <div class="form-group" style="margin-top: 10px; text-align: center;">
                    <a href="/admin/users" style="font-size: 0.9rem;">Back to User List</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
