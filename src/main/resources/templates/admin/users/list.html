<!DOCTYPE html>
<html xmlns:xmls="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <title>Rello Chat - User List</title>
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="icon" href="/rello.png">
    <style>
        .user-list {
            list-style: none;
            padding: 0;
            margin: 20px 0;
            text-align: left;
            max-height: 300px;
            overflow-y: auto;
        }
        .user-list li {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-list li:last-child {
            border-bottom: none;
        }

        /* Custom Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: var(--bg-gradient-2);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            width: 320px;
            text-align: center;
            box-shadow: var(--glass-shadow);
        }
        .modal-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 24px;
            gap: 12px;
        }
        .modal-actions button {
            min-height: 40px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div id="username-page">
        <div class="username-page-container glass-panel" style="max-width: 500px;">
            <h1 class="title">User Management</h1>
            <ul class="user-list">
                <li th:each="user : ${users}">
                    <div>
                        <span th:text="${user.username}" style="font-weight: 600;"></span>
                        <br/>
                        <span th:text="${user.roles}" style="font-size: 0.8rem; color: var(--text-secondary);"></span>
                    </div>
                    <form th:action="@{/admin/users/delete/{id}(id=${user.id})}" method="post" style="margin: 0;">
                        <button type="button" class="accent" style="min-height: 30px; padding: 0 10px; font-size: 0.8rem; width: auto;" onclick="showDeleteModal(this)">Delete</button>
                    </form>
                </li>
            </ul>
            <div class="form-group" style="margin-top: 20px;">
                <a th:href="@{/admin/users/add}" style="text-decoration: none;">
                    <button type="button" class="primary">Add New User</button>
                </a>
            </div>
            <div class="form-group" style="margin-top: 10px; text-align: center;">
                <a href="/" style="font-size: 0.9rem;">Back to Chat</a>
            </div>
        </div>
    </div>

    <!-- Custom Confirm Modal -->
    <div id="custom-confirm-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-bottom: 12px; color: #fff;">Confirm Deletion</h3>
            <p style="font-size: 0.95rem; color: var(--text-secondary);">Are you sure you want to delete this user? This action cannot be undone.</p>
            <div class="modal-actions">
                <button type="button" style="background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2);" onclick="hideDeleteModal()">Cancel</button>
                <button type="button" class="accent" onclick="confirmDelete()">Delete User</button>
            </div>
        </div>
    </div>

    <script>
        let formToSubmit = null;
        
        function showDeleteModal(btn) {
            formToSubmit = btn.closest('form');
            document.getElementById('custom-confirm-modal').style.display = 'flex';
        }
        
        function hideDeleteModal() {
            formToSubmit = null;
            document.getElementById('custom-confirm-modal').style.display = 'none';
        }
        
        function confirmDelete() {
            if (formToSubmit) {
                formToSubmit.submit();
            }
        }
    </script>
</body>
</html>
