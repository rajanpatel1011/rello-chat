# Production SQL Server configuration
spring.datasource.url=jdbc:sqlserver://rellouser.database.windows.net:1433;databaseName=rellouser;encrypt=true;trustServerCertificate=false;loginTimeout=30;
spring.datasource.username=applicationUser
spring.datasource.password=Rello123

# When DB_URL is provided for SQL Server, Spring Boot will infer the driver from the URL.
# If no DB_URL is provided, embedded H2 is used in SQL Server compatibility mode for fallback/demo deployments.

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.default-schema=dbo
spring.h2.console.enabled=false

