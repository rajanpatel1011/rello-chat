version: '3.9'

services:
  app:
    image: rello-chat
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${LOCAL_PORT:-8080}:8082"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_SSL_ENABLED: "true"
      SSL_KEYSTORE_PATH: file:/run/secrets/localhost.p12
      SSL_KEYSTORE_PASSWORD: ${SSL_KEYSTORE_PASSWORD:?Set SSL_KEYSTORE_PASSWORD in .env}
    volumes:
      - ./logs:/app/logs
      - ./target:/app/target:ro
      - ./certs/localhost.p12:/run/secrets/localhost.p12:ro
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
